[project]
name = "arduchat"
version = "0.1.0"
description = "Chat assistant for the ArduPilot Copter documentation"
readme = "README.md"
requires-python = ">=3.12"
# Runtime only: this is what the Docker image installs (no torch, langchain, chromadb, streamlit).
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "groq>=0.37.1",
    "fastembed>=0.9.0",
    "numpy>=2.5.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
# scripts/build_index.py (offline index builder)
build = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "langchain-text-splitters>=1.1.2",
]
# evals/ and loadtest/
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]
